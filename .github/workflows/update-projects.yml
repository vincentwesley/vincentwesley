name: Update projects

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/update-projects.test.mjs
      - run: node scripts/update-projects.mjs
      - name: Commit if README changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "vincentwesley"
          git config user.email "221810966+vincentwesley@users.noreply.github.com"
          git add README.md
          git commit -m "Update projects list"
          git push

  keepalive:
    permissions:
      actions: write
    uses: vincentwesley/house/.github/workflows/keepalive.yml@3b64644b1cad8e42d2b0411710ee7af5a460ab47
